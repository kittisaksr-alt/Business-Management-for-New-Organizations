<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แนวคิดและทฤษฎีการบริหารธุรกิจองค์กรยุคใหม่: การวิเคราะห์ วิพากษ์ และสังเคราะห์เชิงทฤษฎี</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800&display=swap');

        :root {
            --deep-navy: #08142b;
            --navy: #0b1d3a;
            --mid-blue: #0f2b52;
            --accent-gold: #d4a843;
            --accent-light: #f0c56a;
            --cyan: #4fc3f7;
            --soft-white: #f0f4fa;
            --text-dim: #b0c4de;
            --gradient-1: linear-gradient(135deg, #0b1d3a 0%, #132f54 100%);
            --gradient-2: linear-gradient(135deg, #0f2b52 0%, #1a3f6e 100%);
            --shadow-lg: 0 25px 50px -12px rgba(0,0,0,0.5);
            --shadow-md: 0 10px 25px -5px rgba(0,0,0,0.3);
            --border-subtle: 1px solid rgba(255,255,255,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans Thai', 'Segoe UI', system-ui, sans-serif;
            background: radial-gradient(ellipse at center, #0c1e3a 0%, #050d1a 100%);
            color: #fff;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .presentation-wrapper {
            width: 92vw;
            max-width: 1200px;
            height: 78vh;
            max-height: 800px;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .slide-viewport {
            flex: 1;
            background: var(--gradient-1);
            border-radius: 20px;
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            position: relative;
            border: var(--border-subtle);
        }

        .slide {
            display: none;
            width: 100%;
            height: 100%;
            padding: 3rem 3.5rem;
            flex-direction: column;
            animation: slideIn 0.45s cubic-bezier(0.22, 1, 0.36, 1);
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.2) transparent;
        }
        .slide.active { display: flex; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(12px); filter: blur(2px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        .slide-header {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .slide-header .accent-bar {
            width: 6px;
            min-height: 60px;
            background: linear-gradient(180deg, var(--accent-gold) 0%, var(--cyan) 100%);
            border-radius: 3px;
            flex-shrink: 0;
        }
        .slide-header h2 {
            font-size: 2rem;
            font-weight: 700;
            color: #fff;
            line-height: 1.35;
            letter-spacing: -0.3px;
        }
        .slide-header h2 .subtitle {
            display: block;
            font-size: 1.1rem;
            font-weight: 400;
            color: var(--text-dim);
            margin-top: 0.25rem;
        }

        .slide-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1.1rem;
            font-size: 1.05rem;
            line-height: 1.75;
        }

        .badge {
            display: inline-block;
            padding: 0.3rem 0.9rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-right: 0.4rem;
        }
        .badge-importance { background: rgba(212,168,67,0.2); color: var(--accent-gold); }
        .badge-objective { background: rgba(79,195,247,0.2); color: var(--cyan); }
        .badge-link { background: rgba(240,197,106,0.15); color: var(--accent-light); }

        p { margin-bottom: 0.4rem; }

        .highlight { color: var(--accent-gold); font-weight: 700; }
        .highlight-cyan { color: var(--cyan); font-weight: 600; }

        .bullet-list { list-style: none; padding-left: 0; }
        .bullet-list li {
            padding-left: 1.8rem; position: relative; margin-bottom: 0.6rem;
        }
        .bullet-list li::before {
            content: "▹"; position: absolute; left: 0; color: var(--accent-gold);
            font-weight: bold; font-size: 1.3rem; line-height: 1;
        }

        .divider {
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            margin: 0.7rem 0;
        }

        /* ==================== DIAGRAM & FLOW STYLES ==================== */
        .flow-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.2rem;
            flex-wrap: wrap;
            margin: 1.2rem 0;
        }
        .flow-node {
            background: var(--gradient-2);
            border: 2px solid rgba(79,195,247,0.5);
            border-radius: 14px;
            padding: 1rem 1.6rem;
            font-weight: 700;
            color: #fff;
            text-align: center;
            min-width: 140px;
            box-shadow: var(--shadow-md);
            position: relative;
            transition: all 0.3s;
        }
        .flow-node:hover { border-color: var(--cyan); transform: scale(1.03); }
        .flow-node .node-icon { font-size: 1.8rem; display: block; margin-bottom: 0.3rem; }
        .flow-arrow {
            font-size: 2.4rem;
            color: var(--accent-gold);
            font-weight: bold;
            text-shadow: 0 0 8px rgba(212,168,67,0.4);
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.6; } }
        .flow-label {
            font-size: 0.8rem;
            color: var(--text-dim);
            text-align: center;
            margin-top: 0.2rem;
        }

        .feedback-loop {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }
        .feedback-arrow {
            color: var(--cyan);
            font-size: 1.4rem;
        }

        /* Two column layout */
        .two-col {
            display: flex;
            gap: 1.8rem;
        }
        .two-col > div {
            flex: 1;
            background: rgba(21,42,74,0.55);
            border-radius: 14px;
            padding: 1.3rem;
            border: var(--border-subtle);
        }
        .two-col .col-header {
            font-weight: 700;
            color: var(--accent-gold);
            margin-bottom: 0.7rem;
            font-size: 1.1rem;
        }

        /* Table */
        .table-evolution {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin: 1rem 0;
            font-size: 0.95rem;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow-md);
        }
        .table-evolution th {
            background: #152a4a;
            color: #fff;
            padding: 0.9rem;
            text-align: left;
            font-weight: 700;
            border-bottom: 2px solid var(--accent-gold);
        }
        .table-evolution td {
            padding: 0.9rem;
            border-bottom: 1px solid #2a3f5a;
            vertical-align: top;
        }
        .table-evolution tr:last-child td { border-bottom: none; }
        .table-evolution tr:nth-child(even) td { background: rgba(255,255,255,0.03); }
        .table-evolution tr:hover td { background: rgba(212,168,67,0.06); }

        /* DAO Layers */
        .dao-stack {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            margin: 0.6rem 0;
        }
        .dao-layer-card {
            background: var(--gradient-2);
            border-radius: 16px;
            padding: 1rem 1.4rem;
            border-left: 5px solid transparent;
            position: relative;
            transition: all 0.3s;
            box-shadow: var(--shadow-md);
        }
        .dao-layer-card:hover { transform: translateX(4px); }
        .dao-layer-card.layer-1 { border-left-color: #66bb6a; }
        .dao-layer-card.layer-2 { border-left-color: #f9a825; }
        .dao-layer-card.layer-3 { border-left-color: var(--cyan); }
        .dao-layer-card.layer-4 { border-left-color: var(--accent-gold); }
        .dao-layer-card .layer-num {
            position: absolute;
            top: -10px;
            right: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 0.15rem 0.6rem;
            border-radius: 12px;
            background: rgba(0,0,0,0.4);
        }
        .dao-layer-title { font-weight: 700; color: #fff; margin-bottom: 0.3rem; }
        .dao-layer-content { font-size: 0.85rem; color: #d0dbe8; }
        .dao-feedback {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            color: var(--cyan);
            font-size: 1rem;
            font-weight: 500;
            margin: 0.2rem 0;
        }
        .dao-feedback .arrow-icon { font-size: 1.6rem; animation: pulse 2s infinite; }

        .footer-note {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-dim);
            padding-top: 1rem;
        }

        /* Navigation */
        .nav-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
        }
        .nav-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 0.55rem 1.6rem;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.25s;
            backdrop-filter: blur(4px);
        }
        .nav-btn:hover { background: var(--accent-gold); color: #0b1d3a; border-color: var(--accent-gold); }
        .nav-btn:disabled { opacity: 0.3; pointer-events: none; }
        .slide-indicator {
            font-size: 0.9rem;
            color: var(--text-dim);
            font-weight: 500;
            min-width: 60px;
            text-align: center;
        }

        @media (max-width: 768px) {
            .slide { padding: 1.8rem; }
            .slide-header h2 { font-size: 1.5rem; }
            .two-col { flex-direction: column; }
            .flow-container { gap: 0.6rem; }
            .flow-node { min-width: 110px; padding: 0.7rem 1rem; }
        }
    </style>
</head>
<body>
<div class="presentation-wrapper">
    <div class="slide-viewport" id="slideViewport"></div>
    <div class="nav-controls">
        <button class="nav-btn" id="prevBtn" onclick="changeSlide(-1)"> ก่อนหน้า</button>
        <span class="slide-indicator" id="slideIndicator">1 / 15</span>
        <button class="nav-btn" id="nextBtn" onclick="changeSlide(1)">ถัดไป ▶</button>
    </div>
</div>

<script>
    const slides = [
        // ==================== SLIDE 1 ====================
        {
            title: "กรอบการวิเคราะห์ 3 ชั้น และภาพรวมบท",
            subtitle: "ทำไมต้องเรียนทฤษฎี? — วิวัฒนาการผ่านการเปลี่ยนกระบวนทัศน์ (Kuhn, 1962)",
            content: `
                <p><span class="badge badge-importance">📌 ความสำคัญ</span> ทำความเข้าใจวิวัฒนาการทฤษฎีการจัดการอย่างเป็นระบบ เพื่อให้สามารถ<span class="highlight">วิพากษ์ข้อจำกัด</span>และ<span class="highlight">สังเคราะห์เป็นเครื่องมือบริหารสมัยใหม่</span></p>
                <div class="divider"></div>
                <p><span class="badge badge-objective">🎯 วัตถุประสงค์ 4 ข้อของบท</span></p>
                <ul class="bullet-list">
                    <li>① ปูพื้นฐานทฤษฎีการจัดการร่วมสมัย — รู้ว่าแต่ละทฤษฎีเกิดขึ้นมา <span class="highlight">ตอบโจทย์อะไร</span></li>
                    <li>② สร้างความสามารถในการ<span class="highlight">วิพากษ์</span> — เห็นข้อจำกัดที่ทฤษฎีเก่ามองไม่เห็น</li>
                    <li>③ <span class="highlight">เชื่อมโยงบริบทไทย/อาเซียน</span> — ทดสอบว่าฤษฎีตะวันตกใช้ได้จริงหรือไม่ในวัฒนธรรมเรา</li>
                    <li>④ เสนอ<span class="highlight">กรอบ DAO (Dynamic Adaptive Organization)</span> — กรอบสังเคราะห์สำหรับการจัดการยุคใหม่</li>
                </ul>
                <div class="divider"></div>
                <p><span class="badge badge-link">🔗 จุดเริ่มต้นของบท</span> ทฤษฎีวิวัฒนาการผ่าน <span class="highlight">การเปลี่ยนกระบวนทัศน์ (Paradigm Shift — Kuhn, 1962)</span> ไม่ใช่การสะสมแบบราบเรียบ — กรอบ 3 ชั้นจะเผยให้เห็น <em>“สิ่งที่ทฤษฎีเก่ามองไม่เห็น”</em></p>
                <div style="display:flex;justify-content:center;gap:2rem;margin-top:1.2rem;">
                    <div style="background:rgba(21,42,74,0.6);padding:1rem 1.5rem;border-radius:12px;text-align:center;border:1px solid rgba(255,255,255,0.1);">
                        <span style="font-size:2rem;">🔍</span><br><span style="font-weight:700;color:#4fc3f7;">พรรณนา</span><br><span style="font-size:0.8rem;color:#b0c4de;">Descriptive</span>
                    </div>
                    <div style="font-size:2rem;color:#d4a843;display:flex;align-items:center;">→</div>
                    <div style="background:rgba(21,42,74,0.6);padding:1rem 1.5rem;border-radius:12px;text-align:center;border:1px solid rgba(255,255,255,0.1);">
                        <span style="font-size:2rem;">⚡</span><br><span style="font-weight:700;color:#f9a825;">วิพากษ์</span><br><span style="font-size:0.8rem;color:#b0c4de;">Critical</span>
                    </div>
                    <div style="font-size:2rem;color:#d4a843;display:flex;align-items:center;">→</div>
                    <div style="background:rgba(21,42,74,0.6);padding:1rem 1.5rem;border-radius:12px;text-align:center;border:1px solid rgba(255,255,255,0.1);">
                        <span style="font-size:2rem;">🧩</span><br><span style="font-weight:700;color:#66bb6a;">สังเคราะห์</span><br><span style="font-size:0.8rem;color:#b0c4de;">Synthetic</span>
                    </div>
                </div>
            `
        },
        // ==================== SLIDE 2 ====================
        {
            title: "ยุคคลาสสิก: อุปมาองค์กรแบบ “เครื่องจักร” — Taylor",
            subtitle: "Scientific Management (1911) — รากฐานการจัดการเชิงวิทยาศาสตร์",
            content: `
                <p><span class="badge badge-importance">📌 ความสำคัญ</span> วางรากฐานการจัดการเชิงวิทยาศาสตร์ — ศึกษาวิธีเพิ่มผลิตภาพอย่างเป็นระบบ ทุกองค์กรยังใช้หลักคิดนี้ในรูปแบบใดรูปแบบหนึ่ง</p>
                <p><span class="badge badge-objective">🎯 วัตถุประสงค์ของทฤษฎี</span> ลดความสูญเปล่า กำหนด <span class="highlight">“วิธีที่ดีที่สุดเพียงหนึ่งเดียว” (One Best Way)</span> บนสมมติฐานมนุษย์ถูกจูงใจด้วยเงิน (Economic Man)</p>
                <div class="divider"></div>
                <p><span class="highlight-cyan">🔎 ข้อวิพากษ์สำคัญ:</span></p>
                <ul class="bullet-list">
                    <li>Drucker (1999) — ไม่เหมาะกับ <span class="highlight">งานความรู้ (Knowledge Work)</span> ที่ต้องใช้ความคิดสร้างสรรค์</li>
                    <li>Braverman (1974) — <span class="highlight">Deskilling & Alienation</span>: ลดทอนทักษะแรงงาน สร้างความแปลกแยก</li>
                    <li>ละเลยมิติสังคม-จิตวิทยา — มนุษย์ไม่ใช่เครื่องจักร</li>
                </ul>
                <p><span class="badge badge-link">🔗 สังเคราะห์/เชื่อมโยง</span> แนวคิดของ Taylor ถูกปรับปรุงโดย <span class="highlight">Lean Manufacturing (Womack et al., 1990)</span> ที่เพิ่มการมีส่วนร่วมของพนักงาน — วางฐานให้กับ <span class="highlight">ยุคมนุษยสัมพันธ์ (สไลด์ 4)</span></p>
                <div class="flow-container" style="margin-top:0.8rem;">
                    <div class="flow-node"><span class="node-icon">⚙️</span>Taylorism<br><span style="font-size:0.7rem;">One Best Way</span></div>
                    <span class="flow-arrow">⤳</span>
                    <div class="flow-node" style="border-color:#f9a825;"><span class="node-icon">🔄</span>Lean<br><span style="font-size:0.7rem;">Womack et al. 1990</span></div>
                    <span class="flow-arrow">⤳</span>
                    <div class="flow-node" style="border-color:#66bb6a;"><span class="node-icon">👥</span>ยุคมนุษยสัมพันธ์<br><span style="font-size:0.7rem;">Hawthorne Studies</span></div>
                </div>
            `
        },
        // ==================== SLIDE 3 ====================
        {
            title: "ยุคคลาสสิก: Fayol และ Weber — หน้าที่การจัดการและระบบราชการ",
            subtitle: "การสร้าง “ภาษา” ทางการจัดการและหลักการบริหารที่เป็นระบบ",
            content: `
                <p><span class="badge badge-importance">📌 ความสำคัญ</span> สร้าง <span class="highlight">“ภาษา” ทางการจัดการ</span> ที่ใช้ร่วมกันทั่วโลก (วางแผน จัดองค์กร สั่งการ ประสานงาน ควบคุม) และหลักการบริหารที่ใช้ได้ทั้งองค์กรภาครัฐและเอกชน</p>
                <div class="two-col">
                    <div>
                        <span class="col-header">Fayol (1916)</span>
                        <p style="font-size:0.9rem;">5 หน้าที่การจัดการ + 14 หลักการ — ระเบียบ, การแบ่งงาน, สายบังคับบัญชา, Unity of Command</p>
                    </div>
                    <div>
                        <span class="col-header">Weber (1922)</span>
                        <p style="font-size:0.9rem;">ระบบราชการในอุดมคติ (Ideal Bureaucracy) — กฎ, ลำดับชั้น, อำนาจตามกฎหมาย</p>
                    </div>
                </div>
                <p><span class="highlight-cyan">🔎 ข้อวิพากษ์สำคัญ:</span></p>
                <ul class="bullet-list">
                    <li>Mintzberg (1973) — <span class="highlight">ผู้บริหารจริงตัดสินใจภายใต้ความกระจัดกระจาย</span> ไม่เป็นระเบียบ</li>
                    <li>DiMaggio & Powell (1983) — <span class="highlight">Isomorphic Pressure</span> บังคับให้องค์กรเลียนแบบกัน สูญเสียความหลากหลาย</li>
                    <li>Hannan & Freeman (1984) — <span class="highlight">Structural Inertia</span> ทำให้ปรับตัวยากเมื่อสภาพแวดล้อมเปลี่ยน</li>
                </ul>
                <p><span class="badge badge-link">🔗 เชื่อมโยง</span> แนวคิด “ระบบปิด” ถูกท้าทายโดย <span class="highlight">ทฤษฎีระบบเปิด (สไลด์ 5)</span> ที่มององค์กรเชื่อมโยงกับสิ่งแวดล้อมอย่างแยกไม่ออก</p>
            `
        },
        // ==================== SLIDE 4 ====================
        {
            title: "ยุคมนุษยสัมพันธ์: อุปมาองค์กรแบบ “สิ่งมีชีวิต”",
            subtitle: "การค้นพบว่า “มนุษย์ไม่ใช่เครื่องจักร” — Hawthorne Studies (Mayo, 1930s)",

    let currentSlide = 0;
    const viewport = document.getElementById('slideViewport');

    function renderAllSlides() {
        viewport.innerHTML = '';
        slides.forEach((s, i) => {
            const div = document.createElement('div');
            div.className = `slide ${i === 0 ? 'active' : ''}`;
            div.innerHTML = `
                <div class="slide-header">
                    <div class="accent-bar"></div>
                    <h2>${s.title}<span class="subtitle">${s.subtitle}</span></h2>
                </div>
                <div class="slide-body">${s.content}</div>
                <div class="footer-note">
                    <span>${i + 1} / 15</span>
                </div>
            `;
            viewport.appendChild(div);
        });
    }

    function changeSlide(dir) {
        if (dir === -1 && currentSlide > 0) currentSlide--;
        else if (dir === 1 && currentSlide < slides.length - 1) currentSlide++;
        document.querySelectorAll('.slide').forEach((s, i) => s.classList.toggle('active', i === currentSlide));
        document.getElementById('slideIndicator').textContent = `${currentSlide + 1} / 15`;
        document.getElementById('prevBtn').disabled = currentSlide === 0;
        document.getElementById('nextBtn').disabled = currentSlide === slides.length - 1;
    }

    renderAllSlides();
    document.getElementById('slideIndicator').textContent = `1 / 15`;
    document.addEventListener('keydown', e => {
        if (e.key === 'ArrowRight') changeSlide(1);
        if (e.key === 'ArrowLeft') changeSlide(-1);
    });
