html<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แนวคิดและทฤษฎีการบริหารธุรกิจองค์กรยุคใหม่: การวิเคราะห์ วิพากษ์ และสังเคราะห์เชิงทฤษฎี</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans Thai', Calibri, sans-serif;
            background: #0a1128;
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .slide-container {
            position: relative;
            width: 90vw;
            max-width: 1100px;
            height: 70vh;
            max-height: 700px;
            background: #0b1d3a;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .slide {
            display: none;
            width: 100%;
            height: 100%;
            padding: 2.5rem 3rem;
            flex-direction: column;
            animation: fadeIn 0.4s ease;
            overflow-y: auto;
        }

        .slide.active {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .slide-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 1.5rem;
            border-left: 6px solid #d4a843;
            padding-left: 1rem;
            line-height: 1.3;
        }

        .slide-body {
            font-size: 1rem;
            line-height: 1.7;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .bullet-list {
            list-style: none;
            padding-left: 0;
        }

        .bullet-list li {
            padding-left: 1.5rem;
            position: relative;
            margin-bottom: 0.5rem;
        }

        .bullet-list li::before {
            content: "▸";
            position: absolute;
            left: 0;
            color: #d4a843;
            font-weight: bold;
        }

        .highlight {
            color: #d4a843;
            font-weight: 700;
        }

        .slide-footer {
            margin-top: auto;
            text-align: right;
            font-size: 0.85rem;
            color: #8899aa;
        }

        .nav-buttons {
            position: absolute;
            bottom: 1rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 1rem;
            z-index: 10;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff;
            padding: 0.5rem 1.5rem;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .nav-btn:hover {
            background: #d4a843;
            color: #0b1d3a;
            border-color: #d4a843;
        }

        .nav-btn:disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        .slide-counter {
            position: absolute;
            top: 1rem;
            right: 1.5rem;
            font-size: 0.9rem;
            color: #8899aa;
            background: rgba(255, 255, 255, 0.05);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
        }

        /* Table styling */
        .table-evolution {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
            font-size: 0.95rem;
        }

        .table-evolution th {
            background: #152a4a;
            color: #ffffff;
            padding: 0.8rem;
            text-align: left;
            font-weight: 700;
            border-bottom: 2px solid #d4a843;
        }

        .table-evolution td {
            padding: 0.8rem;
            border-bottom: 1px solid #2a3f5a;
            vertical-align: top;
        }

        .table-evolution tr:nth-child(even) td {
            background: rgba(255, 255, 255, 0.03);
        }

        /* Diagrams */
        .diagram-flow {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            margin: 1rem 0;
            flex-wrap: wrap;
        }

        .flow-box {
            background: #152a4a;
            border: 2px solid #4fc3f7;
            border-radius: 10px;
            padding: 1rem 1.4rem;
            font-weight: 700;
            color: #ffffff;
            text-align: center;
            min-width: 150px;
        }

        .flow-arrow {
            font-size: 2rem;
            color: #d4a843;
            font-weight: bold;
        }

        .dao-layer {
            border: 1px solid #4fc3f7;
            border-radius: 8px;
            padding: 0.8rem 1.2rem;
            margin-bottom: 0.5rem;
            background: rgba(21, 42, 74, 0.7);
            position: relative;
        }

        .dao-layer .layer-title {
            font-weight: 700;
            color: #d4a843;
            margin-bottom: 0.3rem;
        }

        .dao-layer .layer-content {
            font-size: 0.9rem;
            color: #e0e0e0;
        }

        .feedback-arrow-down, .feedback-arrow-up {
            text-align: center;
            color: #4fc3f7;
            font-size: 1.2rem;
            margin: 0.2rem 0;
        }

        .two-col {
            display: flex;
            gap: 1.5rem;
        }

        .two-col > div {
            flex: 1;
            background: rgba(21, 42, 74, 0.5);
            border-radius: 8px;
            padding: 1rem;
        }

        @media (max-width: 768px) {
            .slide {
                padding: 1.5rem;
            }
            .slide-title {
                font-size: 1.4rem;
            }
            .two-col {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="slide-container" id="slideContainer">
        <!-- Slides injected via JS for cleanliness, but can also be hardcoded -->
    </div>

    <div class="nav-buttons">
        <button class="nav-btn" id="prevBtn" onclick="changeSlide(-1)">◀ ก่อนหน้า</button>
        <button class="nav-btn" id="nextBtn" onclick="changeSlide(1)">ถัดไป ▶</button>
    </div>

        let currentSlide = 0;
        const container = document.getElementById('slideContainer');

        function renderSlides() {
            container.innerHTML = '';
            slidesData.forEach((slide, index) => {
                const slideDiv = document.createElement('div');
                slideDiv.className = `slide ${index === 0 ? 'active' : ''}`;
                slideDiv.innerHTML = `
                    <div class="slide-title">${slide.title}</div>
                    <div class="slide-body">${slide.body}</div>
                    <div class="slide-footer">${index + 1} / 15</div>
                `;
                container.appendChild(slideDiv);
            });
            updateNavButtons();
        }

        function changeSlide(direction) {
            if (direction === -1 && currentSlide > 0) {
                currentSlide--;
            } else if (direction === 1 && currentSlide < slidesData.length - 1) {
                currentSlide++;
            }
            document.querySelectorAll('.slide').forEach((s, i) => {
                s.classList.toggle('active', i === currentSlide);
            });
            updateNavButtons();
        }

        function updateNavButtons() {
            document.getElementById('prevBtn').disabled = currentSlide === 0;
            document.getElementById('nextBtn').disabled = currentSlide === slidesData.length - 1;
        }

        // Init
        renderSlides();

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') changeSlide(1);
            if (e.key === 'ArrowLeft') changeSlide(-1);
        });
    </script>
